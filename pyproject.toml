[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-last-hidden-state"
version = "0.30.0"
description = "One-token prompt hidden states through vLLM chat completions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["packaging>=24.2"]

[project.urls]
Repository = "https://github.com/numindai/vLLM-Last-Hidden-State"
Issues = "https://github.com/numindai/vLLM-Last-Hidden-State/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<0.17"]

[project.scripts]
vllm-last-hidden-state = "vllm_last_hidden_state.serve:main"

[project.entry-points."vllm.endpoint_plugins"]
last_hidden_state = "vllm_last_hidden_state.endpoint:LastHiddenStatePlugin"

[tool.setuptools.packages.find]
include = ["vllm_last_hidden_state*"]

[tool.pytest.ini_options]
testpaths = ["validation"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["vllm", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
